name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  integrity:
    name: Fixture integrity + runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python3 scripts/check_fixtures.py
          python3 -m unittest discover -s tests -v

  conformance:
    name: HL7 validator conformance (Kenya Core ke.fhir.core#1.0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Caches only registry dependencies (hl7.fhir.r4.core etc.). Pinned JAR + IG are always re-downloaded and hash-checked.
      - uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-validator-7.0.6-ke-core-1.0.0-${{ hashFiles('deps.sha256') }}
      - name: Fetch pinned validator and IG package (fails on checksum mismatch)
        run: scripts/fetch_deps.sh
      - name: Validate all fixtures
        run: python3 scripts/run_validator.py --report results/ci-validation.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: results/ci-validation.json
          if-no-files-found: warn
